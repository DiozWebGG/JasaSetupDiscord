<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Owner Dashboard - Kelola Pesanan Jasa</title>
    <!-- FontAwesome Icons & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #5865F2;
            --accent: #FAA61A;
            --success: #43B581;
            --danger: #F04747;
            --bg-dark: #1e1f22;
            --card-bg: #2b2d31;
            --table-header: #313338;
            --text-color: #f2f3f5;
            --text-muted: #949ba4;
        }

        * {
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            transition: all 0.2s ease;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-color);
            padding: 30px 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .header-title h1 {
            font-size: 26px;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-title h1 i {
            color: var(--primary);
        }

        /* Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.05);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .stat-card i {
            font-size: 32px;
            padding: 12px;
            border-radius: 10px;
            background: rgba(255,255,255,0.05);
        }

        .stat-info h3 {
            font-size: 20px;
            font-weight: 700;
        }

        .stat-info p {
            font-size: 12px;
            color: var(--text-muted);
        }

        /* Controls / Filter */
        .controls {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            gap: 15px;
            flex-wrap: wrap;
        }

        .search-box {
            position: relative;
            flex: 1;
            min-width: 250px;
        }

        .search-box input {
            width: 100%;
            padding: 10px 15px 10px 40px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.1);
            background: var(--card-bg);
            color: #fff;
            outline: none;
        }

        .search-box i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        /* Table Design */
        .table-responsive {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.05);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background: var(--table-header);
            padding: 16px 20px;
            font-size: 13px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        td {
            padding: 16px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            font-size: 14px;
        }

        tr {
            animation: rowAppear 0.5s ease-out forwards;
        }

        @keyframes rowAppear {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        tr:hover {
            background: rgba(255,255,255,0.02);
        }

        .badge {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .badge-pending { background: rgba(250, 166, 26, 0.2); color: var(--accent); border: 1px solid var(--accent); }
        .badge-accepted { background: rgba(67, 181, 129, 0.2); color: var(--success); border: 1px solid var(--success); }
        .badge-rejected { background: rgba(240, 71, 71, 0.2); color: var(--danger); border: 1px solid var(--danger); }

        .action-btns {
            display: flex;
            gap: 8px;
        }

        .btn {
            padding: 7px 12px;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .btn-accept { background: var(--success); color: white; }
        .btn-accept:hover { background: #3ca374; box-shadow: 0 0 10px rgba(67, 181, 129, 0.4); }

        .btn-reject { background: var(--danger); color: white; }
        .btn-reject:hover { background: #d83c3c; box-shadow: 0 0 10px rgba(240, 71, 71, 0.4); }

        .btn-delete { background: rgba(255,255,255,0.1); color: var(--text-muted); }
        .btn-delete:hover { background: rgba(255,255,255,0.2); color: #fff; }

        .copy-btn {
            background: transparent;
            border: none;
            color: var(--primary);
            cursor: pointer;
            margin-left: 5px;
        }
        .copy-btn:hover { color: #fff; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-title">
        <h1><i class="fa-solid fa-shield-halved"></i> Dashboard Owner</h1>
        <span style="font-size: 13px; color: var(--text-muted);"><i class="fa-solid fa-rotate"></i> Sync Real-time Active</span>
    </div>

    <!-- Ringkasan Statistik -->
    <div class="stats-grid">
        <div class="stat-card">
            <i class="fa-solid fa-boxes-stacked" style="color: var(--primary);"></i>
            <div class="stat-info">
                <h3 id="statTotal">0</h3>
                <p>Total Pesanan</p>
            </div>
        </div>
        <div class="stat-card">
            <i class="fa-solid fa-hourglass-half" style="color: var(--accent);"></i>
            <div class="stat-info">
                <h3 id="statPending">0</h3>
                <p>Menunggu (Pending)</p>
            </div>
        </div>
        <div class="stat-card">
            <i class="fa-solid fa-circle-check" style="color: var(--success);"></i>
            <div class="stat-info">
                <h3 id="statAccepted">0</h3>
                <p>Pesanan Diterima</p>
            </div>
        </div>
        <div class="stat-card">
            <i class="fa-solid fa-sack-dollar" style="color: var(--accent);"></i>
            <div class="stat-info">
                <h3 id="statEarnings">0</h3>
                <p>Total OwO Cash</p>
            </div>
        </div>
    </div>

    <!-- Pencarian -->
    <div class="controls">
        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchInput" placeholder="Cari berdasarkan username / jenis jasa..." onkeyup="filterOrders()">
        </div>
    </div>

    <!-- Tabel Pesanan -->
    <div class="table-responsive">
        <table>
            <thead>
                <tr>
                    <th>Waktu</th>
                    <th>User Discord</th>
                    <th>Layanan Jasa</th>
                    <th>Durasi / Biaya</th>
                    <th>Bukti Pembayaran</th>
                    <th>Status</th>
                    <th>Aksi</th>
                </tr>
            </thead>
            <tbody id="orderList">
                <tr>
                    <td colspan="7" style="text-align: center; padding: 30px; color: var(--text-muted);">
                        <i class="fa-solid fa-spinner fa-spin" style="font-size: 24px;"></i><br><br>Menghubungkan ke database...
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, update, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyC7mJnJTYMR8fO6Xt4FNrYa3_vpOAccY4o",
        authDomain: "jasa-setup-discord-member.firebaseapp.com",
        databaseURL: "https://jasa-setup-discord-member-default-rtdb.firebaseio.com",
        projectId: "jasa-setup-discord-member",
        storageBucket: "jasa-setup-discord-member.firebasestorage.app",
        messagingSenderId: "870435922952",
        appId: "1:870435922952:web:280ecdf38fdb6ba4aa5dbd",
        measurementId: "G-4BZQBV5Z0N"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const orderList = document.getElementById('orderList');
    let rawOrdersData = {};

    onValue(ref(db, 'orders'), (snapshot) => {
        orderList.innerHTML = '';
        rawOrdersData = snapshot.val();

        if (!rawOrdersData) {
            orderList.innerHTML = '<tr><td colspan="7" style="text-align: center; color: var(--text-muted); padding: 30px;">Belum ada pesanan masuk.</td></tr>';
            updateStats(0, 0, 0, 0);
            return;
        }

        let total = 0, pending = 0, accepted = 0, earnings = 0;

        Object.keys(rawOrdersData).reverse().forEach(key => {
            const item = rawOrdersData[key];
            total++;

            if (item.status === 'Pending') pending++;
            if (item.status === 'Diterima') {
                accepted++;
                earnings += item.totalPrice;
            }

            renderRow(key, item);
        });

        updateStats(total, pending, accepted, earnings);
    });

    function renderRow(key, item) {
        const tr = document.createElement('tr');
        tr.setAttribute('id', `row-${key}`);

        let badgeHtml = `<span class="badge badge-pending"><i class="fa-solid fa-clock"></i> Pending</span>`;
        if (item.status === 'Diterima') badgeHtml = `<span class="badge badge-accepted"><i class="fa-solid fa-circle-check"></i> Diterima</span>`;
        if (item.status === 'Ditolak') badgeHtml = `<span class="badge badge-rejected"><i class="fa-solid fa-circle-xmark"></i> Ditolak</span>`;

        tr.innerHTML = `
            <td><small style="color:var(--text-muted);">${item.createdAt}</small></td>
            <td>
                <strong>${item.username}</strong>
                <button class="copy-btn" onclick="copyText('${item.username}')" title="Salin Username"><i class="fa-regular fa-copy"></i></button>
            </td>
            <td>${item.service}</td>
            <td>
                <strong>${item.duration} Hari</strong><br>
                <small style="color:var(--accent); font-weight:bold;">${item.totalPrice.toLocaleString('id-ID')} OwO</small>
            </td>
            <td>
                <span title="${item.proof}">${item.proof.length > 25 ? item.proof.substring(0, 25) + '...' : item.proof}</span>
                <button class="copy-btn" onclick="copyText('${item.proof}')" title="Salin Bukti"><i class="fa-regular fa-copy"></i></button>
            </td>
            <td>${badgeHtml}</td>
            <td>
                <div class="action-btns">
                    <button class="btn btn-accept" onclick="updateStatus('${key}', 'Diterima')" title="Terima Pesanan"><i class="fa-solid fa-check"></i></button>
                    <button class="btn btn-reject" onclick="updateStatus('${key}', 'Ditolak')" title="Tolak Pesanan"><i class="fa-solid fa-xmark"></i></button>
                    <button class="btn btn-delete" onclick="deleteOrder('${key}')" title="Hapus"><i class="fa-solid fa-trash"></i></button>
                </div>
            </td>
        `;
        orderList.appendChild(tr);
    }

    function updateStats(total, pending, accepted, earnings) {
        document.getElementById('statTotal').innerText = total;
        document.getElementById('statPending').innerText = pending;
        document.getElementById('statAccepted').innerText = accepted;
        document.getElementById('statEarnings').innerText = earnings.toLocaleString('id-ID');
    }

    window.updateStatus = function(id, newStatus) {
        update(ref(db, 'orders/' + id), { status: newStatus });
    }

    window.deleteOrder = function(id) {
        if (confirm('Apakah kamu yakin ingin menghapus pesanan ini?')) {
            remove(ref(db, 'orders/' + id));
        }
    }

    window.copyText = function(text) {
        navigator.clipboard.writeText(text);
        alert('Teks berhasil disalin!');
    }

    window.filterOrders = function() {
        const input = document.getElementById('searchInput').value.toLowerCase();
        const rows = orderList.getElementsByTagName('tr');

        for (let row of rows) {
            const text = row.innerText.toLowerCase();
            row.style.display = text.includes(input) ? '' : 'none';
        }
    }
</script>
</body>
</html>
